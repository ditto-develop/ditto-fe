<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연결할 수 없어요</title>
<!--
  네이티브 셸이 원격 URL(ditto.pics)을 열지 못했을 때 대신 보여주는 화면.
  capacitor.config.ts 의 `server.errorPath` 가 이 파일을 가리킨다.

  ⚠️ **이 파일은 앱 번들 안에서 로컬로 열린다.** 네트워크가 끊긴 상황이 존재 이유이므로
  외부 폰트·이미지·스크립트를 절대 참조하면 안 된다. 색도 CSS 토큰 파일을 불러올 수 없어
  값을 복제한다 — capacitor.config.ts 의 android.backgroundColor 와 같은 이유다.
  토큰이 바뀌면 여기도 함께 바꿔야 한다.
-->
<style>
  :root {
    /* --color-atomic-neutral-95 (= --color-semantic-background-normal-normal) */
    --bg: #E9E6E2;
    /* --color-atomic-neutral-20 (= --color-semantic-label-normal) */
    --fg: #1A1815;
    /* --color-atomic-neutral-40 (= --color-semantic-label-alternative 계열) */
    --fg-soft: #4B4642;
    /* --color-atomic-neutral-99 */
    --on-primary: #F3F1EF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    /* 번들에 웹폰트를 넣지 않는다. 시스템 한글 폰트로 충분하다. */
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding:
      calc(24px + env(safe-area-inset-top, 0px))
      24px
      calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.02em;
  }

  p {
    margin: 0;
    max-width: 320px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--fg-soft);
  }

  button {
    margin-top: 12px;
    min-width: 200px;
    height: 48px;
    padding: 0 24px;
    border: 0;
    border-radius: 12px;
    background: var(--fg);
    color: var(--on-primary);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  button:active { opacity: 0.85; }
  button:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>
  <h1>연결할 수 없어요</h1>
  <p>네트워크 상태를 확인한 뒤 다시 시도해 주세요.<br>잠시 후 저절로 연결될 수도 있어요.</p>
  <button type="button" id="retry">다시 시도</button>

  <script>
    /*
     * 언제 이 화면이 뜨나 — 실제 오프라인만이 아니다.
     * Capacitor 는 메인 문서 로드가 실패하면 **에러 종류를 가리지 않고** 이 화면으로 바꾼다.
     * iOS 는 취소(NSURLErrorCancelled, -999)까지 실패로 친다. 백그라운드에서 돌아와
     * 웹뷰가 reload 하는데 네트워크가 아직 안 붙었거나, 문서 로드 도중 다른 이동이
     * 끼어들면 멀쩡한 망에서도 여기로 온다. 그래서 사용자가 버튼을 누르기 전에
     * 연결이 돌아오면 스스로 원래 화면으로 돌아간다.
     *
     * 네이티브 셸이 이 화면을 열 때 실패 정보를 쿼리로 넘긴다(code·domain·desc·url —
     * ios SceneDelegate.swift 의 OfflineAwareNavigationDelegate, android MainActivity 의
     * OfflineAwareWebViewClient). 그 셸들은 취소(-999)·이동 중단(WebKit 102)은 아예 이 화면으로
     * 보내지 않는다. 이전 앱 빌드는 쿼리 없이 열고 취소도 여기로 보낸다 — 쿼리가 없으면 "알 수 없음"
     * 으로 기록한다.
     */

    /*
     * 진단 기록기 — Grafana Faro 수집 주소로 "언제·왜 이 화면이 떴고 얼마 만에 돌아갔는지"를 보낸다.
     *
     * 이 화면은 앱 번들 안의 별도 origin(capacitor://localhost, https://localhost)이라 웹의
     * Faro SDK(src/shared/lib/observability/faro.ts)를 쓸 수 없고, 외부 스크립트도 받을 수 없다
     * (맨 위 주석). 그래서 Faro 수집 형식({meta, events})을 직접 만들어 보낸다.
     * 망이 끊긴 채로 뜨는 화면이라 바로 보내지 않고 localStorage 에 쌓아 두었다가, 서버에 닿는다고
     * 확인된 순간(떠나기 직전) 한 번에 보낸다.
     *
     * 수집 주소는 빌드할 때 scripts/inject-offline-faro.mjs 가 아래 자리표시자를 바꿔 넣는다.
     * 자리표시자 그대로면(next dev, 주소 미설정 빌드) 기록기는 아무것도 하지 않는다.
     */
    var FARO_URL = "__FARO_COLLECTOR_URL__";
    var FARO_APP_VERSION = "__FARO_APP_VERSION__";
    var DIAG_QUEUE_KEY = "ditto:offline-diagnostics";
    // 오래 오프라인이어도 저장소를 채우지 않게 최근 것만 남긴다.
    var DIAG_QUEUE_MAX = 50;
    var diagEnabled = FARO_URL.indexOf("https://") === 0;
    var diagSessionId = String(Date.now()) + Math.random().toString(36).slice(2, 10);
    var shownAt = Date.now();
    var probeCount = 0;

    function stripQuery(url) {
      var cut = url.search(/[?#]/);
      return cut === -1 ? url : url.slice(0, cut);
    }

    function readDiagQueue() {
      try {
        var queue = JSON.parse(window.localStorage.getItem(DIAG_QUEUE_KEY) || "[]");
        return Array.isArray(queue) ? queue : [];
      } catch (e) {
        return [];
      }
    }

    function writeDiagQueue(queue) {
      try {
        window.localStorage.setItem(DIAG_QUEUE_KEY, JSON.stringify(queue.slice(-DIAG_QUEUE_MAX)));
      } catch (e) {}
    }

    /* Faro 이벤트 하나를 쌓는다. 속성 값은 Faro 형식상 전부 문자열이어야 한다. */
    function record(name, attributes) {
      if (!diagEnabled) return;
      var attrs = { platform: /Android/i.test(navigator.userAgent) ? "android" : "ios" };
      Object.keys(attributes).forEach(function (key) { attrs[key] = String(attributes[key]); });
      var queue = readDiagQueue();
      queue.push({ name: name, domain: "app_offline", attributes: attrs, timestamp: new Date().toISOString() });
      writeDiagQueue(queue);
    }

    /*
     * 쌓인 기록을 보낸다. 바로 뒤에 화면을 떠나므로 keepalive 로 이동 중에도 요청이 살아 있게 한다.
     * 보내기 전에 큐를 비우고, 실패가 확인되면 되돌려 놓는다 — 이동으로 결과를 못 받으면 그 묶음은
     * 잃는다(중복 전송보다 낫다).
     */
    function flushDiagnostics() {
      if (!diagEnabled) return;
      var queue = readDiagQueue();
      if (queue.length === 0) return;
      writeDiagQueue([]);
      var body = JSON.stringify({
        meta: {
          app: { name: "ditto-fe", version: FARO_APP_VERSION, environment: "production" },
          session: { id: diagSessionId },
          page: { url: window.location.origin + window.location.pathname },
          browser: { userAgent: navigator.userAgent },
        },
        events: queue,
      });
      var restore = function () { writeDiagQueue(queue.concat(readDiagQueue())); };
      try {
        fetch(FARO_URL, {
          method: "POST",
          keepalive: true,
          headers: { "Content-Type": "application/json" },
          body: body,
        })
          .then(function (res) { if (!res.ok) restore(); })
          .catch(restore);
      } catch (e) {
        restore();
      }
    }

    (function recordShown() {
      var params = new URLSearchParams(window.location.search);
      record("offline_page_shown", {
        error_code: params.get("code") || "unknown",
        error_domain: params.get("domain") || "unknown",
        error_desc: params.get("desc") || "",
        failing_url: stripQuery(params.get("url") || ""),
        online: navigator.onLine,
        history_length: window.history.length,
      });
    })();

    // 앱이 원래 열어야 할 주소. capacitor.config.ts 의 server.url 과 같아야 한다.
    var HOME = "https://ditto.pics/";

    // HOME 으로 직접 갈 때 붙이는 표식. 웹(src/shared/lib/observability/faro.ts)이 읽고 지운다.
    var FROM_OFFLINE_QUERY = "?from=offline-page";

    // HOME 으로 직접 갔다가 다시 여기로 떨어졌는지 표시한다. 그 경우 바로 앞 기록이
    // 이 화면 자신이라 history.back() 이 같은 화면만 되풀이하므로 HOME 을 다시 연다.
    var VIA_HOME_KEY = "ditto:offline-via-home";
    var VIA_HOME_TTL_MS = 60 * 1000;

    // 자동 재시도 간격. 단일 인스턴스 서버에 재접속이 몰리지 않게 점점 늘린다.
    var RETRY_DELAYS_MS = [2000, 4000, 8000, 15000, 30000];
    var PROBE_TIMEOUT_MS = 5000;
    // 이동을 시작했는데 이만큼 지나도 이 화면에 남아 있으면 버튼을 되살린다.
    var LEAVE_STUCK_MS = 15000;

    var button = document.getElementById("retry");
    var leaving = false;
    var attempt = 0;
    var timer = null;
    var stuckTimer = null;

    /* 다시 시도할 수 있는 상태로 되돌린다. 이동이 시작되지 않았거나 bfcache 로 돌아온 경우. */
    function reset() {
      clearTimeout(stuckTimer);
      leaving = false;
      button.disabled = false;
      button.textContent = "다시 시도";
      attempt = 0;
      scheduleProbe(RETRY_DELAYS_MS[0]);
    }

    function cameViaHome() {
      try {
        var at = Number(window.sessionStorage.getItem(VIA_HOME_KEY));
        return Number.isFinite(at) && Date.now() - at < VIA_HOME_TTL_MS;
      } catch (e) {
        return false;
      }
    }

    /*
     * 원래 보던 화면으로 돌아간다.
     * 에러 화면은 실패한 이동 **뒤에** 새 기록으로 쌓이므로, 앞 기록이 있으면 그게
     * 사용자가 보던(또는 열려던) 화면이다. 앱을 처음 켜다 실패한 경우처럼 앞 기록이
     * 없으면 HOME 으로 간다.
     */
    function leave(trigger) {
      if (leaving) return;
      leaving = true;
      record("offline_page_left", {
        trigger: trigger,
        elapsed_ms: Date.now() - shownAt,
        probes: probeCount,
        online: navigator.onLine,
      });
      flushDiagnostics();
      clearTimeout(timer);
      button.disabled = true;
      button.textContent = "연결하는 중…";
      stuckTimer = setTimeout(reset, LEAVE_STUCK_MS);

      if (window.history.length > 1 && !cameViaHome()) {
        try { window.sessionStorage.removeItem(VIA_HOME_KEY); } catch (e) {}
        window.history.back();
        return;
      }
      try { window.sessionStorage.setItem(VIA_HOME_KEY, String(Date.now())); } catch (e) {}
      window.location.replace(HOME + FROM_OFFLINE_QUERY);
    }

    /*
     * 서버에 닿는지 먼저 확인한다. 닿지 않는데 이동하면 같은 실패로 이 화면이
     * 다시 그려지며 깜빡이기만 한다. no-cors 라 응답 내용은 못 보지만, 네트워크
     * 오류가 아니면 resolve 되므로 "닿는다"를 판단하기에 충분하다.
     */
    function probe() {
      probeCount += 1;
      if (navigator.onLine === false) return Promise.resolve(false);
      var controller = typeof AbortController === "function" ? new AbortController() : null;
      var abortTimer = setTimeout(function () {
        if (controller) controller.abort();
      }, PROBE_TIMEOUT_MS);
      return fetch(HOME + "?offline-probe=" + Date.now(), {
        mode: "no-cors",
        cache: "no-store",
        signal: controller ? controller.signal : undefined,
      })
        .then(function () { return true; })
        .catch(function () { return false; })
        .then(function (ok) {
          clearTimeout(abortTimer);
          return ok;
        });
    }

    function scheduleProbe(delay) {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (leaving || document.visibilityState === "hidden") return;
        probe().then(function (ok) {
          if (ok) {
            leave("probe");
            return;
          }
          attempt = Math.min(attempt + 1, RETRY_DELAYS_MS.length - 1);
          scheduleProbe(RETRY_DELAYS_MS[attempt]);
        });
      }, delay);
    }

    // 버튼은 확인 없이 바로 간다 — 사용자가 직접 누른 시도까지 막지 않는다.
    button.addEventListener("click", function () { leave("button"); });

    // 망이 돌아오거나 앱이 다시 앞으로 오면 기다리지 않고 바로 확인한다.
    window.addEventListener("online", function () {
      attempt = 0;
      scheduleProbe(0);
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible") return;
      attempt = 0;
      scheduleProbe(0);
    });

    window.addEventListener("pageshow", function (event) {
      if (event.persisted) reset();
    });

    scheduleProbe(RETRY_DELAYS_MS[0]);
  </script>
</body>
</html>
