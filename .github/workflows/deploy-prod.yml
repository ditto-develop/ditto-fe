name: ✈️ DITTO FE PROD DEPLOY

# `deploy` 에 푸시하면 곧바로 프로덕션(ditto.pics)에 배포된다.
# staging 환경을 두지 않기로 했기 때문이다(2026-08-26). 검증 버퍼가 없는 대신
# 아래 verify 잡이 통과해야만 deploy 가 돌도록 게이팅한다.
#
# 릴리스 브랜치를 `feat/s3-migration` 에서 `deploy` 로 분리했다(2026-09-19).
# 개발/통합은 계속 feat/s3-migration 에서 하고, 릴리스는 feat/s3-migration → deploy
# 머지로만 일어난다 — 작업 브랜치에 푸시했다고 프로덕션이 나가는 일이 없어진다.
#
# alpha.ditto.pics 를 도입하면 이 파일을 복제해 S3 프리픽스와 트리거 브랜치만
# 바꾸면 된다. 자세한 절차는 docs/app-shell-runbook.md 참고.
on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # BE는 시각을 'yyyy-MM-dd HH:mm:ss' KST 벽시계로 내려주고 parseServerDateTime은
      # 이를 브라우저 로컬로 파싱한다(한국 전용 서비스). 러너 기본 UTC로는 9시간 어긋나
      # 채팅 종료 임박 배너 같은 시각 의존 테스트가 실패하므로 실사용 환경에 맞춘다.
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Cypress E2E
        run: npm run test:e2e:cypress

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}
          NEXT_PUBLIC_DITTO_API_KEY: ${{ secrets.NEXT_PUBLIC_DITTO_API_KEY }}
          # 원격 푸시(FCM) 킬 스위치. BE 디바이스 토큰 API 가 라이브라 켜 둔다
          # (POST/DELETE /api/v1/notifications/devices). 진입점이 전부
          # isNativeApp() 로 막혀 있어 웹 방문자에게는 영향이 없다.
          # 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_PUSH_ENABLED: 'true'
          # 앱의 카카오 네이티브 SDK 로그인 킬 스위치. 진입점이 isNativeApp() 로 막혀
          # 있어 웹 방문자는 기존 리다이렉트 로그인 그대로다. 네이티브가 취소 아닌
          # 이유로 실패하면 리다이렉트 로그인으로 폴백하므로 앱에서도 로그인이 막히지
          # 않는다. 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_NATIVE_KAKAO_LOGIN_ENABLED: 'true'
          # 애플 로그인 킬 스위치. **앱·웹 양쪽에 함께 적용된다** — 켜는 조건 둘을
          # 2026-09-08 에 확인하고 켰다(docs/app-shell-runbook.md §6 "켜는 절차"):
          #   1. 라이브 스펙에 apple 이 있다 — /api/v1/users/social-login/apple/native
          #      와 /api/v1/users/social-login/{provider} 의 APPLE 이 모두 떴다.
          #   2. 웹 Services ID·Return URL 이 등록돼 있다 — /social-login/APPLE 이
          #      client_id=pics.ditto.web 로 302 하고 애플이 인가 화면을 돌려준다
          #      (미등록이면 invalid_client 오류 페이지가 온다).
          # 되돌릴 일이 생기면 이 줄만 지우면 된다 — 버튼이 다시 사라진다.
          NEXT_PUBLIC_APPLE_LOGIN_ENABLED: 'true'
          # GA4 측정 ID. **deploy 잡에만** 넣는다 — verify 잡에 넣으면 Cypress E2E
          # 트래픽이 프로덕션 속성에 섞여 지표가 오염된다.
          # 값이 비면 계측 코드가 전부 no-op 이므로, 되돌릴 일이 생기면 이 줄만
          # 지우면 된다(빌드는 그대로 성공한다).
          # ⚠️ output: 'export' 라 이 값은 빌드 시점에 정적 치환된다. secret 등록을
          # 빠뜨리면 빌드는 성공하고 프로덕션에서만 계측이 조용히 꺼진다.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Verify CloudFront rewrite function is in sync with build output
        # 새 동적 라우트가 추가됐는데 함수를 재생성하지 않으면 그 라우트의 딥링크가
        # 조용히 깨진다. 빌드 산출물과 커밋된 함수가 어긋나면 여기서 배포를 멈춘다.
        run: node scripts/generate-cf-rewrite-function.mjs --check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3 Upload — static chunks first (additive, never deleted)
        # **순서가 중요하다.** 청크를 라우트 HTML 보다 먼저 올린다 — 반대로 하면
        # 새 HTML 이 아직 없는 청크를 가리키는 창이 생긴다.
        #
        # **`--delete` 를 쓰지 않는다.** 파일명에 콘텐츠 해시가 붙어 있어 구 청크가
        # 남아 있어도 충돌하지 않고, 배포 시점에 이미 문서를 받아 둔 탭이 그 구 청크를
        # 요청한다. 여기서 지우면 그 탭은 라우트를 옮기는 순간 ChunkLoadError 로 죽는다
        # (=배포가 곧 세션 끊김). 남은 구 청크는 이 잡 마지막의 "Prune abandoned chunks"
        # 단계가 7일 뒤 정리한다.
        #
        # `cp --recursive` 라 매 배포 전량 재업로드다(수 MB). 그래야 살아 있는 청크의
        # LastModified 가 갱신돼 정리 대상이 **버려진 청크에만** 걸린다.
        #
        # **로컬(./out)에서 올린다. S3→S3 복사를 쓰면 안 된다.**
        # `aws s3 cp --metadata-directive REPLACE` 로 헤더만 바꾸면 Content-Type 이
        # 전부 `binary/octet-stream` 으로 떨어져 JS/CSS/이미지가 통째로 깨진다
        # (2026-09-18 실제 사고 — run 35312035278). 로컬 업로드는 `sync` 와 같은 경로로
        # 확장자에서 타입을 추측하므로 안전하다.
        run: |
          set -euo pipefail
          aws s3 cp ./out "s3://${{ secrets.S3_BUCKET }}/prod" --recursive --only-show-errors \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: S3 Sync to prod prefix
        # 청크를 제외한 나머지(라우트 HTML·__next.*.txt·public 자산)를 동기화한다.
        # 여기는 `--delete` 를 유지한다 — 삭제된 라우트가 그 URL 에 계속 살아 있으면 안 된다.
        #
        # `--exclude "_next/static/*"` 는 복사뿐 아니라 **삭제 대상에서도** 뺀다.
        # 위 단계에서 올린 청크와 이전 배포의 구 청크가 이 sync 에 지워지지 않는 이유다.
        #
        # 기본값은 HTML 기준으로 안전한 쪽(매 요청 재검증)에 둔다. 정적 자산의
        # 긴 캐시는 아래 단계에서 덮어쓴다 — 여기서 길게 주면 라우트 HTML 이 배포 뒤에도
        # 며칠 동안 옛 청크를 가리킨다.
        run: |
          aws s3 sync ./out s3://${{ secrets.S3_BUCKET }}/prod --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Re-upload public assets with a long Cache-Control
        # 이미지·아이콘·폰트가 배포마다 통째로 다시 내려오던 문제를 막는다.
        # (`_next/static` 은 위에서 이미 immutable 로 올렸다.)
        #
        # 분류는 **디렉터리가 아니라 확장자**로 한다. `out/quiz`·`out/onboarding` 은
        # public 자산과 라우트 산출물(index.html·__next.*.txt)이 **같은 경로에 섞여** 있어서,
        # 디렉터리째 30일을 걸면 라우트 HTML 이 캐시에 박혀 배포가 사용자에게 도달하지 않는다.
        run: |
          set -euo pipefail
          BUCKET="s3://${{ secrets.S3_BUCKET }}/prod"

          # public/ 자산은 해시가 없어 같은 이름으로 내용이 바뀔 수 있으므로 30일로 끊는다.
          # 마지막 --exclude 가 이긴다 — 위에서 immutable 을 준 것을 되돌리지 않는다.
          aws s3 cp ./out "$BUCKET" --recursive --only-show-errors \
            --exclude "*" \
            --include "*.svg" --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.webp" --include "*.gif" --include "*.ico" \
            --include "*.woff" --include "*.woff2" \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=2592000, stale-while-revalidate=86400"

      - name: Verify Content-Type and Cache-Control on the uploaded objects
        # 캐시 헤더를 다시 쓰는 과정에서 Content-Type 이 망가지면 사이트가 통째로 깨진다
        # (2026-09-18 사고). 클래스마다 한 개씩 뽑아 타입과 캐시를 함께 확인한다.
        #
        # 라우트 HTML/txt 도 본다 — 여기에 긴 캐시가 붙으면 배포가 사용자에게 도달하지
        # 않는다. `quiz`/`onboarding` 처럼 자산과 라우트가 섞인 경로가 특히 위험하다.
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"

          # TYPE_GLOB 은 glob 이다 — .js 추측 결과가 파이썬 버전에 따라 text/javascript 와
          # application/javascript 로 갈려서 한쪽으로 못 박을 수 없다.
          assert_head() {
            KEY="$1"; TYPE_GLOB="$2"; EXPECTED_CACHE="$3"
            HEAD=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY")
            TYPE=$(echo "$HEAD" | jq -r '.ContentType')
            CACHE=$(echo "$HEAD" | jq -r '.CacheControl // ""')
            echo "$KEY -> $TYPE / $CACHE"
            case "$TYPE" in
              $TYPE_GLOB) ;;
              *) echo "::error::$KEY Content-Type 이 $TYPE_GLOB 과 다르다: $TYPE"; exit 1 ;;
            esac
            case "$CACHE" in
              *"$EXPECTED_CACHE"*) ;;
              *) echo "::error::$KEY Cache-Control 에 $EXPECTED_CACHE 가 없다: $CACHE"; exit 1 ;;
            esac
          }

          JS_KEY=$(cd ./out && find _next/static -name '*.js' | head -n 1)
          assert_head "prod/$JS_KEY" "*javascript*" "immutable"

          CSS_KEY=$(cd ./out && find _next/static -name '*.css' | head -n 1)
          assert_head "prod/$CSS_KEY" "text/css*" "immutable"

          SVG_KEY=$(cd ./out && find assets -name '*.svg' | head -n 1)
          assert_head "prod/$SVG_KEY" "image/svg+xml*" "max-age=2592000"

          PNG_KEY=$(cd ./out && find assets -name '*.png' | head -n 1)
          assert_head "prod/$PNG_KEY" "image/png*" "max-age=2592000"

          # 라우트 HTML 은 자산과 경로가 섞여 있어도 매 요청 재검증이어야 한다.
          assert_head "prod/index.html" "text/html*" "must-revalidate"
          assert_head "prod/quiz/current/index.html" "text/html*" "must-revalidate"
          assert_head "prod/onboarding/intro/index.html" "text/html*" "must-revalidate"

          TXT_KEY=$(cd ./out && find quiz -name '*.txt' | head -n 1)
          assert_head "prod/$TXT_KEY" "text/plain*" "must-revalidate"

      - name: Fix apple-app-site-association content type
        # 이 파일은 확장자가 없어서 `s3 sync` 가 binary/octet-stream 으로 올린다.
        # 애플은 AASA 를 application/json 으로 요구하므로 다시 올려 타입만 고친다.
        # 실패해도 배포를 막지 않는다 — 유니버설 링크만 안 걸리고 앱은 동작한다.
        continue-on-error: true
        run: |
          aws s3 cp \
            s3://${{ secrets.S3_BUCKET }}/prod/.well-known/apple-app-site-association \
            s3://${{ secrets.S3_BUCKET }}/prod/.well-known/apple-app-site-association \
            --content-type application/json --metadata-directive REPLACE

      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Publish CloudFront rewrite function
        # CF_REWRITE_FUNCTION_NAME 변수가 설정되기 전에는 건너뛴다.
        # 값은 `www-to-apex-ditto-pics` — 배포판에 이미 붙어 있는 함수이며 새로
        # 만드는 것이 아니라 내용을 교체한다. 이 함수는 rewrite 뿐 아니라
        # www→아펙스 301 과 S3 프리픽스까지 담당하므로, 커밋된 소스가 곧 함수 전체다.
        # 일회성 설정 절차는 docs/app-shell-runbook.md §4 참고.
        if: vars.CF_REWRITE_FUNCTION_NAME != ''
        run: |
          set -euo pipefail
          FN="${{ vars.CF_REWRITE_FUNCTION_NAME }}"
          ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FN" \
            --if-match "$ETAG" \
            --function-config Comment="www->apex 301 + host prefix routing + static export dynamic route rewrite",Runtime=cloudfront-js-2.0 \
            --function-code fileb://infra/cloudfront/rewrite-dynamic-routes.js
          NEW_ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FN" --if-match "$NEW_ETAG"

      - name: Prune abandoned chunks older than 7 days
        # 청크 업로드에서 `--delete` 를 뺀 대가로 버려진 청크가 쌓인다. 여기서 정리한다.
        #
        # **S3 라이프사이클 룰(나이 기준 Expiration)을 쓰지 않는 이유**: 룰은 배포와
        # 무관하게 돌기 때문에, 7일간 배포가 없으면 **살아 있는 청크까지 전부** 만료돼
        # 사이트가 통째로 깨진다. 정리를 배포 안에 두면 "배포할 때만 프로덕션이 바뀐다"는
        # 성질이 유지되고, 조용한 기간에는 아무것도 지워지지 않는다.
        #
        # 안전장치 두 겹: (1) 7일 넘은 객체만 후보다 — 위 업로드 단계가 매 배포 살아 있는
        # 청크를 전량 재업로드하므로 현재 빌드의 객체는 방금 갱신돼 후보에 들지 않는다.
        # (2) 그래도 이번 빌드(./out)에 들어 있는 키는 후보에서 뺀다.
        #
        # 실패해도 배포를 막지 않는다 — 정리가 밀려도 사이트는 멀쩡하다(용량만 남는다).
        continue-on-error: true
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          # aws CLI 의 LastModified 출력 형식과 글자 그대로 맞춘다(사전식 비교를 쓴다).
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S+00:00)
          echo "기준 시각: $CUTOFF"

          (cd ./out && find _next/static -type f) | sed 's|^|prod/|' | sort > current-keys.txt

          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "prod/_next/static/" --output json \
            | jq -r --arg cutoff "$CUTOFF" '.Contents[]? | select(.LastModified < $cutoff) | .Key' \
            | sort > old-keys.txt

          comm -23 old-keys.txt current-keys.txt > prune-keys.txt
          COUNT=$(wc -l < prune-keys.txt | tr -d ' ')
          echo "버려진 청크 $COUNT 개 (현재 빌드 $(wc -l < current-keys.txt | tr -d ' ') 개는 보존)"
          if [ "$COUNT" -eq 0 ]; then exit 0; fi

          xargs -a prune-keys.txt -n 1 -P 8 -I {} \
            aws s3 rm "s3://$BUCKET/{}" --only-show-errors
