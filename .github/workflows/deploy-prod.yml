name: ✈️ DITTO FE PROD DEPLOY

# feat/s3-migration 에 푸시하면 곧바로 프로덕션(ditto.pics)에 배포된다.
# staging 환경을 두지 않기로 했기 때문이다(2026-08-26). 검증 버퍼가 없는 대신
# 아래 verify 잡이 통과해야만 deploy 가 돌도록 게이팅한다.
#
# alpha.ditto.pics 를 도입하면 이 파일을 복제해 S3 프리픽스와 트리거 브랜치만
# 바꾸면 된다. 자세한 절차는 docs/app-shell-runbook.md 참고.
on:
  push:
    branches:
      - feat/s3-migration
  workflow_dispatch:

env:
  # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # BE는 시각을 'yyyy-MM-dd HH:mm:ss' KST 벽시계로 내려주고 parseServerDateTime은
      # 이를 브라우저 로컬로 파싱한다(한국 전용 서비스). 러너 기본 UTC로는 9시간 어긋나
      # 채팅 종료 임박 배너 같은 시각 의존 테스트가 실패하므로 실사용 환경에 맞춘다.
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Cypress E2E
        run: npm run test:e2e:cypress

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}
          NEXT_PUBLIC_DITTO_API_KEY: ${{ secrets.NEXT_PUBLIC_DITTO_API_KEY }}
          # 원격 푸시(FCM) 킬 스위치. BE 디바이스 토큰 API 가 라이브라 켜 둔다
          # (POST/DELETE /api/v1/notifications/devices). 진입점이 전부
          # isNativeApp() 로 막혀 있어 웹 방문자에게는 영향이 없다.
          # 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_PUSH_ENABLED: 'true'
          # 앱의 카카오 네이티브 SDK 로그인 킬 스위치. 진입점이 isNativeApp() 로 막혀
          # 있어 웹 방문자는 기존 리다이렉트 로그인 그대로다. 네이티브가 취소 아닌
          # 이유로 실패하면 리다이렉트 로그인으로 폴백하므로 앱에서도 로그인이 막히지
          # 않는다. 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_NATIVE_KAKAO_LOGIN_ENABLED: 'true'
          # 애플 로그인 킬 스위치. **앱·웹 양쪽에 함께 적용된다** — 켜는 조건 둘을
          # 2026-09-08 에 확인하고 켰다(docs/app-shell-runbook.md §6 "켜는 절차"):
          #   1. 라이브 스펙에 apple 이 있다 — /api/v1/users/social-login/apple/native
          #      와 /api/v1/users/social-login/{provider} 의 APPLE 이 모두 떴다.
          #   2. 웹 Services ID·Return URL 이 등록돼 있다 — /social-login/APPLE 이
          #      client_id=pics.ditto.web 로 302 하고 애플이 인가 화면을 돌려준다
          #      (미등록이면 invalid_client 오류 페이지가 온다).
          # 되돌릴 일이 생기면 이 줄만 지우면 된다 — 버튼이 다시 사라진다.
          NEXT_PUBLIC_APPLE_LOGIN_ENABLED: 'true'
          # GA4 측정 ID. **deploy 잡에만** 넣는다 — verify 잡에 넣으면 Cypress E2E
          # 트래픽이 프로덕션 속성에 섞여 지표가 오염된다.
          # 값이 비면 계측 코드가 전부 no-op 이므로, 되돌릴 일이 생기면 이 줄만
          # 지우면 된다(빌드는 그대로 성공한다).
          # ⚠️ output: 'export' 라 이 값은 빌드 시점에 정적 치환된다. secret 등록을
          # 빠뜨리면 빌드는 성공하고 프로덕션에서만 계측이 조용히 꺼진다.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      - name: Verify CloudFront rewrite function is in sync with build output
        # 새 동적 라우트가 추가됐는데 함수를 재생성하지 않으면 그 라우트의 딥링크가
        # 조용히 깨진다. 빌드 산출물과 커밋된 함수가 어긋나면 여기서 배포를 멈춘다.
        run: node scripts/generate-cf-rewrite-function.mjs --check

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3 Sync to prod prefix
        # 기본값은 HTML 기준으로 안전한 쪽(매 요청 재검증)에 둔다. 정적 자산의
        # 긴 캐시는 아래 단계에서 덮어쓴다 — 여기서 길게 주면 라우트 HTML 이 배포 뒤에도
        # 며칠 동안 옛 청크를 가리킨다.
        run: |
          aws s3 sync ./out s3://${{ secrets.S3_BUCKET }}/prod --delete \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Set Cache-Control on static assets
        # 이미지·아이콘·청크가 배포마다 통째로 다시 내려오던 문제를 막는다.
        # `s3 sync` 는 내용이 바뀐 파일만 올리므로, 헤더만 바꾸려면 이렇게 server-side
        # copy 로 메타데이터를 다시 써야 한다(그래서 매 배포 전량 적용 — 수 MB라 싸다).
        #
        # `_next/static/**` 는 파일명에 콘텐츠 해시가 붙어 있어 immutable 로 못 박아도
        # 안전하다. public/ 자산(assets·icons·quiz·onboarding 등)은 해시가 없어 같은
        # 이름으로 내용이 바뀔 수 있으므로 30일로 끊고 stale-while-revalidate 를 붙인다.
        run: |
          set -euo pipefail
          BUCKET="s3://${{ secrets.S3_BUCKET }}/prod"

          aws s3 cp "$BUCKET/_next/static/" "$BUCKET/_next/static/" \
            --recursive --metadata-directive REPLACE \
            --cache-control "public, max-age=31536000, immutable"

          for DIR in assets icons logo display quiz onboarding; do
            # 산출물에 없는 디렉터리는 조용히 건너뛴다(public/ 구성이 바뀔 수 있다).
            if [ -d "./out/$DIR" ]; then
              aws s3 cp "$BUCKET/$DIR/" "$BUCKET/$DIR/" \
                --recursive --metadata-directive REPLACE \
                --cache-control "public, max-age=2592000, stale-while-revalidate=86400"
            fi
          done

      - name: Verify static asset headers survived the metadata rewrite
        # `--metadata-directive REPLACE` 는 Content-Type 도 다시 쓴다(CLI 가 확장자로 추측).
        # 추측이 빗나가면 CSS/JS 가 text/plain 으로 내려가 사이트가 통째로 깨지므로,
        # 각 클래스에서 한 개만 뽑아 타입과 캐시 헤더를 함께 확인한다.
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"

          # TYPE_GLOB 은 glob 이다 — .js 추측 결과가 파이썬 버전에 따라 text/javascript 와
          # application/javascript 로 갈려서 한쪽으로 못 박을 수 없다.
          assert_head() {
            KEY="$1"; TYPE_GLOB="$2"; EXPECTED_CACHE="$3"
            HEAD=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY")
            TYPE=$(echo "$HEAD" | jq -r '.ContentType')
            CACHE=$(echo "$HEAD" | jq -r '.CacheControl // ""')
            echo "$KEY -> $TYPE / $CACHE"
            case "$TYPE" in
              $TYPE_GLOB) ;;
              *) echo "::error::$KEY Content-Type 이 $TYPE_GLOB 과 다르다: $TYPE"; exit 1 ;;
            esac
            case "$CACHE" in
              *"$EXPECTED_CACHE"*) ;;
              *) echo "::error::$KEY Cache-Control 에 $EXPECTED_CACHE 가 없다: $CACHE"; exit 1 ;;
            esac
          }

          JS_KEY=$(cd ./out && find _next/static -name '*.js' | head -n 1)
          assert_head "prod/$JS_KEY" "*javascript*" "immutable"

          SVG_KEY=$(cd ./out && find assets -name '*.svg' | head -n 1)
          assert_head "prod/$SVG_KEY" "image/svg+xml*" "max-age=2592000"

      - name: Fix apple-app-site-association content type
        # 이 파일은 확장자가 없어서 `s3 sync` 가 binary/octet-stream 으로 올린다.
        # 애플은 AASA 를 application/json 으로 요구하므로 다시 올려 타입만 고친다.
        # 실패해도 배포를 막지 않는다 — 유니버설 링크만 안 걸리고 앱은 동작한다.
        continue-on-error: true
        run: |
          aws s3 cp \
            s3://${{ secrets.S3_BUCKET }}/prod/.well-known/apple-app-site-association \
            s3://${{ secrets.S3_BUCKET }}/prod/.well-known/apple-app-site-association \
            --content-type application/json --metadata-directive REPLACE

      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Publish CloudFront rewrite function
        # CF_REWRITE_FUNCTION_NAME 변수가 설정되기 전에는 건너뛴다.
        # 값은 `www-to-apex-ditto-pics` — 배포판에 이미 붙어 있는 함수이며 새로
        # 만드는 것이 아니라 내용을 교체한다. 이 함수는 rewrite 뿐 아니라
        # www→아펙스 301 과 S3 프리픽스까지 담당하므로, 커밋된 소스가 곧 함수 전체다.
        # 일회성 설정 절차는 docs/app-shell-runbook.md §4 참고.
        if: vars.CF_REWRITE_FUNCTION_NAME != ''
        run: |
          set -euo pipefail
          FN="${{ vars.CF_REWRITE_FUNCTION_NAME }}"
          ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FN" \
            --if-match "$ETAG" \
            --function-config Comment="www->apex 301 + host prefix routing + static export dynamic route rewrite",Runtime=cloudfront-js-2.0 \
            --function-code fileb://infra/cloudfront/rewrite-dynamic-routes.js
          NEW_ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FN" --if-match "$NEW_ETAG"
