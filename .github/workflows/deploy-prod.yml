name: ✈️ DITTO FE PROD DEPLOY

# `deploy` 에 푸시하면 곧바로 프로덕션(ditto.pics)에 배포된다.
# staging 환경을 두지 않기로 했기 때문이다(2026-08-26). 검증 버퍼가 없는 대신
# 아래 verify 잡이 통과해야만 deploy 가 돌도록 게이팅한다.
#
# 릴리스 브랜치를 `feat/s3-migration` 에서 `deploy` 로 분리했다(2026-09-19).
# 개발/통합은 계속 feat/s3-migration 에서 하고, 릴리스는 feat/s3-migration → deploy
# 머지로만 일어난다 — 작업 브랜치에 푸시했다고 프로덕션이 나가는 일이 없어진다.
#
# alpha.ditto.pics 를 도입하면 이 파일을 복제해 S3 프리픽스와 트리거 브랜치만
# 바꾸면 된다. 자세한 절차는 docs/app-shell-runbook.md 참고.
on:
  push:
    branches:
      - deploy
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "되돌릴 릴리스 id (releases-meta/ 아래 폴더 이름). 비우면 현재 커밋을 정상 배포한다."
        required: false
        type: string

# 배포가 겹치면 늦게 시작한 쪽의 함수가 먼저 게시될 수 있다. 하나씩만 돈다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.rollback_to == ''
    runs-on: ubuntu-latest
    # 아래 'Reuse a passing E2E result' 단계가 같은 커밋의 e2e.yml 실행 결과를 읽는다.
    permissions:
      contents: read
      actions: read
    env:
      # BE는 시각을 'yyyy-MM-dd HH:mm:ss' KST 벽시계로 내려주고 parseServerDateTime은
      # 이를 브라우저 로컬로 파싱한다(한국 전용 서비스). 러너 기본 UTC로는 9시간 어긋나
      # 채팅 종료 임박 배너 같은 시각 의존 테스트가 실패하므로 실사용 환경에 맞춘다.
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Reuse a passing E2E result for this exact commit
        id: e2e
        # 게이트는 그대로다 — 이 커밋(github.sha)이 e2e.yml 에서 이미 통과했을 때만 Cypress 를 건너뛴다.
        # deploy 는 feat/s3-migration 을 그대로 올리므로, 그 브랜치 푸시 때 e2e.yml 이 같은 커밋을 테스트해 둔다.
        # 그 실행이 아직 돌고 있으면 기다리고(최대 20분), 없거나 실패·취소됐으면 아래에서 직접 돌린다.
        # 푸시 실행만 본다 — PR 실행은 base 와 합친 임시 머지 커밋을 테스트하므로 이 커밋 그대로가 아니다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${{ github.repository }}/actions/workflows/e2e.yml/runs?head_sha=${{ github.sha }}&event=push&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
              echo "이 커밋의 E2E 가 이미 통과했다 — Cypress 를 다시 돌리지 않는다."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! echo "$runs" | jq -e 'any(.[]; .status != "completed")' >/dev/null; then
              break
            fi
            echo "이 커밋의 E2E 가 아직 도는 중이다 — 30초 뒤 다시 본다 ($attempt/40)."
            sleep 30
          done
          echo "이 커밋의 통과한 E2E 가 없다 — 여기서 직접 돌린다."
          echo "passed=false" >> "$GITHUB_OUTPUT"

      - name: Cypress E2E
        if: steps.e2e.outputs.passed != 'true'
        run: npm run test:e2e:cypress

  deploy:
    needs: verify
    if: github.event_name != 'workflow_dispatch' || inputs.rollback_to == ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_KAKAO_JS_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JS_KEY }}
          NEXT_PUBLIC_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_REDIRECT_URI }}
          NEXT_PUBLIC_DITTO_API_KEY: ${{ secrets.NEXT_PUBLIC_DITTO_API_KEY }}
          # 원격 푸시(FCM) 킬 스위치. BE 디바이스 토큰 API 가 라이브라 켜 둔다
          # (POST/DELETE /api/v1/notifications/devices). 진입점이 전부
          # isNativeApp() 로 막혀 있어 웹 방문자에게는 영향이 없다.
          # 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_PUSH_ENABLED: 'true'
          # 앱의 카카오 네이티브 SDK 로그인 킬 스위치. 진입점이 isNativeApp() 로 막혀
          # 있어 웹 방문자는 기존 리다이렉트 로그인 그대로다. 네이티브가 취소 아닌
          # 이유로 실패하면 리다이렉트 로그인으로 폴백하므로 앱에서도 로그인이 막히지
          # 않는다. 되돌릴 일이 생기면 이 줄만 지우면 된다.
          NEXT_PUBLIC_NATIVE_KAKAO_LOGIN_ENABLED: 'true'
          # 애플 로그인 킬 스위치. **앱·웹 양쪽에 함께 적용된다** — 켜는 조건 둘을
          # 2026-09-08 에 확인하고 켰다(docs/app-shell-runbook.md §6 "켜는 절차"):
          #   1. 라이브 스펙에 apple 이 있다 — /api/v1/users/social-login/apple/native
          #      와 /api/v1/users/social-login/{provider} 의 APPLE 이 모두 떴다.
          #   2. 웹 Services ID·Return URL 이 등록돼 있다 — /social-login/APPLE 이
          #      client_id=pics.ditto.web 로 302 하고 애플이 인가 화면을 돌려준다
          #      (미등록이면 invalid_client 오류 페이지가 온다).
          # 되돌릴 일이 생기면 이 줄만 지우면 된다 — 버튼이 다시 사라진다.
          NEXT_PUBLIC_APPLE_LOGIN_ENABLED: 'true'
          # 웹(브라우저) 차단 — 앱 웹뷰가 아니면 어느 주소든 앱 다운로드 안내(/download)를 그린다
          # (src/shared/lib/webGate.ts). **deploy 잡에만** 넣는다 — verify 잡(Cypress)은 브라우저라
          # 켜면 모든 화면이 막힌다(코드에서도 Cypress 는 비켜 주지만 이중으로 막아 둔다).
          # 되돌릴 일이 생기면 이 줄만 지우면 된다 — 웹에서 다시 모든 화면이 열린다.
          NEXT_PUBLIC_WEB_GATE_ENABLED: 'true'
          # GA4 측정 ID. **deploy 잡에만** 넣는다 — verify 잡에 넣으면 Cypress E2E
          # 트래픽이 프로덕션 속성에 섞여 지표가 오염된다.
          # 값이 비면 계측 코드가 전부 no-op 이므로, 되돌릴 일이 생기면 이 줄만
          # 지우면 된다(빌드는 그대로 성공한다).
          # ⚠️ output: 'export' 라 이 값은 빌드 시점에 정적 치환된다. secret 등록을
          # 빠뜨리면 빌드는 성공하고 프로덕션에서만 계측이 조용히 꺼진다.
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          # Grafana Faro(프런트엔드 관측) 수집 주소. 공개값이라 secret 이 아니라 repo **variable** 이다.
          # GA 와 같은 이유로 **deploy 잡에만** 넣는다 — verify 잡(Cypress)은 next dev 라 어차피 꺼지지만
          # E2E 트래픽이 섞일 여지를 두지 않는다. 비면 계측이 전부 no-op 이다(빌드는 성공한다).
          # 같은 값을 scripts/inject-offline-faro.mjs 가 out/app-offline.html 에도 넣는다 — 다만 그 화면은
          # 앱 번들 사본이 쓰이므로 실제 반영은 다음 앱 빌드(cap:sync)부터다.
          NEXT_PUBLIC_FARO_URL: ${{ vars.FARO_COLLECTOR_URL }}
          NEXT_PUBLIC_FARO_APP_VERSION: ${{ github.sha }}

      - name: Verify CloudFront rewrite function is in sync with build output
        # 새 동적 라우트가 추가됐는데 함수를 재생성하지 않으면 그 라우트의 딥링크가
        # 조용히 깨진다. 빌드 산출물과 커밋된 함수가 어긋나면 여기서 배포를 멈춘다.
        run: node scripts/generate-cf-rewrite-function.mjs --check

      - name: Render the release function
        # 이번 빌드는 `releases/<RELEASE_ID>/` 에 통째로 올라가고, 이 사본(프리픽스 한 줄만
        # 바꾼 함수)을 게시하는 순간 사용자가 한 번에 넘어간다. S3 에 아무것도 올리기 전에
        # 만들어 둔다 — 여기서 실패하면 프로덕션은 손대지 않은 채로 멈춘다.
        #
        # id 에 run_attempt 를 넣는 이유: 같은 커밋을 재실행하면 빌드 ID 가 달라진다.
        # 살아 있는 폴더를 덮어쓰면 그 순간 다시 신·구가 섞인다.
        run: |
          set -euo pipefail
          RELEASE_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          node scripts/render-cf-release-function.mjs "$RELEASE_ID" cf-release-function.js

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: S3 Upload — static chunks to the shared pool (additive, never deleted)
        # 청크는 릴리스 폴더가 아니라 **버전 공용 `prod/_next/static/`** 에 쌓는다.
        # 함수가 `/_next/static/` 만 여기로 보낸다. 배포 시점에 이미 문서를 받아 둔 탭이
        # 옛 청크를 계속 요청하므로, 릴리스를 넘겨도 옛 청크는 그대로 받을 수 있어야 한다.
        #
        # **`--delete` 를 쓰지 않는다.** 파일명에 콘텐츠 해시가 붙어 있어 구 청크가 남아 있어도
        # 충돌하지 않는다. 지우면 그 탭은 라우트를 옮기는 순간 ChunkLoadError 로 죽는다.
        # 남은 구 청크는 이 잡 마지막의 "Prune" 단계가 정리한다.
        #
        # `cp --recursive` 라 매 배포 전량 재업로드다(수 MB). 그래야 살아 있는 청크의
        # LastModified 가 갱신돼 정리 대상이 **버려진 청크에만** 걸린다.
        #
        # **로컬(./out)에서 올린다. S3→S3 복사를 쓰면 안 된다.**
        # `aws s3 cp --metadata-directive REPLACE` 로 헤더만 바꾸면 Content-Type 이
        # 전부 `binary/octet-stream` 으로 떨어져 JS/CSS/이미지가 통째로 깨진다
        # (2026-09-18 실제 사고 — run 35312035278).
        run: |
          set -euo pipefail
          aws s3 cp ./out "s3://${{ secrets.S3_BUCKET }}/prod" --recursive --only-show-errors \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: S3 Upload — the rest into a new release folder
        # 라우트 HTML·__next.*.txt·public 자산을 **아직 아무도 보지 않는** 새 폴더에 올린다.
        # 이 단계가 몇 분 걸려도 사용자는 계속 이전 릴리스를 본다 — 파일 단위로 덮어쓰던
        # 예전 방식의 "배포 중 화면마다 버전이 섞이는" 구간이 없어졌다.
        #
        # 새 폴더라 `--delete` 가 필요 없다. 지워진 라우트는 새 릴리스에 없으니 자연히 사라진다.
        #
        # 기본값은 HTML 기준으로 안전한 쪽(매 요청 재검증)에 둔다. 정적 자산의
        # 긴 캐시는 아래 단계에서 덮어쓴다.
        run: |
          aws s3 cp ./out "s3://${{ secrets.S3_BUCKET }}/releases/$RELEASE_ID" --recursive --only-show-errors \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Re-upload public assets with a long Cache-Control
        # 이미지·아이콘·폰트가 배포마다 통째로 다시 내려오던 문제를 막는다.
        #
        # 분류는 **디렉터리가 아니라 확장자**로 한다. `out/quiz`·`out/onboarding` 은
        # public 자산과 라우트 산출물(index.html·__next.*.txt)이 **같은 경로에 섞여** 있어서,
        # 디렉터리째 30일을 걸면 라우트 HTML 이 캐시에 박혀 배포가 사용자에게 도달하지 않는다.
        run: |
          set -euo pipefail
          # public/ 자산은 해시가 없어 같은 이름으로 내용이 바뀔 수 있으므로 30일로 끊는다.
          aws s3 cp ./out "s3://${{ secrets.S3_BUCKET }}/releases/$RELEASE_ID" --recursive --only-show-errors \
            --exclude "*" \
            --include "*.svg" --include "*.png" --include "*.jpg" --include "*.jpeg" \
            --include "*.webp" --include "*.gif" --include "*.ico" \
            --include "*.woff" --include "*.woff2" \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=2592000, stale-while-revalidate=86400"

      - name: Fix apple-app-site-association content type
        # 이 파일은 확장자가 없어서 업로드가 binary/octet-stream 으로 올린다.
        # 애플은 AASA 를 application/json 으로 요구하므로 **로컬에서** 타입을 지정해 다시 올린다.
        # 실패해도 배포를 막지 않는다 — 유니버설 링크만 안 걸리고 앱은 동작한다.
        continue-on-error: true
        run: |
          aws s3 cp ./out/.well-known/apple-app-site-association \
            "s3://${{ secrets.S3_BUCKET }}/releases/$RELEASE_ID/.well-known/apple-app-site-association" \
            --content-type application/json \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Verify Content-Type and Cache-Control on the uploaded objects
        # 캐시 헤더를 다시 쓰는 과정에서 Content-Type 이 망가지면 사이트가 통째로 깨진다
        # (2026-09-18 사고). 클래스마다 한 개씩 뽑아 타입과 캐시를 함께 확인한다.
        # **전환 전에** 본다 — 여기서 실패하면 사용자는 계속 이전 릴리스를 본다.
        #
        # 라우트 HTML/txt 도 본다 — 여기에 긴 캐시가 붙으면 배포가 사용자에게 도달하지
        # 않는다. `quiz`/`onboarding` 처럼 자산과 라우트가 섞인 경로가 특히 위험하다.
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          RELEASE="releases/$RELEASE_ID"

          # TYPE_GLOB 은 glob 이다 — .js 추측 결과가 파이썬 버전에 따라 text/javascript 와
          # application/javascript 로 갈려서 한쪽으로 못 박을 수 없다.
          assert_head() {
            KEY="$1"; TYPE_GLOB="$2"; EXPECTED_CACHE="$3"
            HEAD=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY")
            TYPE=$(echo "$HEAD" | jq -r '.ContentType')
            CACHE=$(echo "$HEAD" | jq -r '.CacheControl // ""')
            echo "$KEY -> $TYPE / $CACHE"
            case "$TYPE" in
              $TYPE_GLOB) ;;
              *) echo "::error::$KEY Content-Type 이 $TYPE_GLOB 과 다르다: $TYPE"; exit 1 ;;
            esac
            case "$CACHE" in
              *"$EXPECTED_CACHE"*) ;;
              *) echo "::error::$KEY Cache-Control 에 $EXPECTED_CACHE 가 없다: $CACHE"; exit 1 ;;
            esac
          }

          JS_KEY=$(cd ./out && find _next/static -name '*.js' | head -n 1)
          assert_head "prod/$JS_KEY" "*javascript*" "immutable"

          CSS_KEY=$(cd ./out && find _next/static -name '*.css' | head -n 1)
          assert_head "prod/$CSS_KEY" "text/css*" "immutable"

          SVG_KEY=$(cd ./out && find assets -name '*.svg' | head -n 1)
          assert_head "$RELEASE/$SVG_KEY" "image/svg+xml*" "max-age=2592000"

          PNG_KEY=$(cd ./out && find assets -name '*.png' | head -n 1)
          assert_head "$RELEASE/$PNG_KEY" "image/png*" "max-age=2592000"

          # 라우트 HTML 은 자산과 경로가 섞여 있어도 매 요청 재검증이어야 한다.
          assert_head "$RELEASE/index.html" "text/html*" "must-revalidate"
          assert_head "$RELEASE/quiz/current/index.html" "text/html*" "must-revalidate"
          assert_head "$RELEASE/onboarding/intro/index.html" "text/html*" "must-revalidate"

          TXT_KEY=$(cd ./out && find quiz -name '*.txt' | head -n 1)
          assert_head "$RELEASE/$TXT_KEY" "text/plain*" "must-revalidate"

      - name: Record release metadata (for rollback and pruning)
        # 롤백은 "그 릴리스의 함수를 다시 게시"이고, 청크 정리는 "남겨 둔 릴리스가 쓰는 청크는
        # 지우지 않는다"이다. 둘 다 릴리스별 기록이 필요해서 전환 전에 남긴다.
        #
        # `releases-meta/` 는 함수가 절대 만들지 않는 경로라 사이트로는 노출되지 않는다
        # (모든 요청에 `/releases/<id>` 같은 프리픽스가 붙는다).
        run: |
          set -euo pipefail
          META="s3://${{ secrets.S3_BUCKET }}/releases-meta/$RELEASE_ID"
          (cd ./out && find _next/static -type f) | sed 's|^|prod/|' | sort > chunks.txt
          aws s3 cp chunks.txt "$META/chunks.txt" --only-show-errors
          aws s3 cp cf-release-function.js "$META/function.js" --only-show-errors

      - name: Switch — publish the release function
        # **이 단계가 배포의 전부다.** 여기까지는 사용자가 아무것도 보지 못했다.
        # 함수가 엣지에 퍼지는 몇 초 동안 사용자마다 넘어가는 시점은 다르지만, 한 요청이
        # 받는 문서와 파일은 항상 같은 릴리스다.
        #
        # 캐시 키는 함수가 바꾼 URI 로 잡히므로 새 릴리스는 처음부터 새 캐시를 쓴다.
        #
        # 값은 `www-to-apex-ditto-pics` — 배포판에 이미 붙어 있는 함수이며 새로
        # 만드는 것이 아니라 내용을 교체한다. 이 함수는 rewrite 뿐 아니라
        # www→아펙스 301 과 S3 프리픽스까지 담당하므로, 커밋된 소스가 곧 함수 전체다.
        run: |
          set -euo pipefail
          FN="${{ vars.CF_REWRITE_FUNCTION_NAME }}"
          if [ -z "$FN" ]; then
            echo "::error::CF_REWRITE_FUNCTION_NAME 이 비어 있다 — 함수를 게시하지 않으면 새 릴리스가 영영 안 나간다."
            exit 1
          fi
          ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FN" \
            --if-match "$ETAG" \
            --function-config Comment="release $RELEASE_ID: www->apex 301 + host prefix routing + static export dynamic route rewrite",Runtime=cloudfront-js-2.0 \
            --function-code fileb://cf-release-function.js
          NEW_ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FN" --if-match "$NEW_ETAG"
          echo "::notice::릴리스 $RELEASE_ID 로 전환했다. 되돌리려면 이 워크플로를 rollback_to 로 수동 실행한다."

      - name: CloudFront Invalidation
        # 새 릴리스는 새 캐시 키라 무효화가 없어도 바로 나간다. 다만 404 폴백(`/index.html`)처럼
        # 함수를 거치지 않는 응답이 있어 기존처럼 한 번 비운다.
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Prune old releases and abandoned chunks
        # 릴리스는 최근 5개만 남긴다(롤백 후보). 청크는 7일 넘었고 **남긴 릴리스 어디에도 없는**
        # 것만 지운다 — 롤백해도 그 릴리스의 청크가 살아 있어야 하기 때문이다.
        #
        # **S3 라이프사이클 룰(나이 기준 Expiration)을 쓰지 않는 이유**: 룰은 배포와
        # 무관하게 돌기 때문에, 7일간 배포가 없으면 **살아 있는 청크까지 전부** 만료돼
        # 사이트가 통째로 깨진다. 정리를 배포 안에 두면 "배포할 때만 프로덕션이 바뀐다"는
        # 성질이 유지된다.
        #
        # 7일 기준을 남겨 두는 이유: 릴리스 폴더 도입 전 배포가 쓰던 청크는 기록이 없다.
        # 배포 전에 열어 둔 탭도 며칠은 옛 청크를 요청한다.
        #
        # 실패해도 배포를 막지 않는다 — 정리가 밀려도 사이트는 멀쩡하다(용량만 남는다).
        continue-on-error: true
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          KEEP=5

          # 1) 릴리스: 기록(chunks.txt)의 LastModified 로 최신순 정렬해 KEEP 개를 남긴다.
          #    방금 전환한 릴리스는 가장 최신이라 항상 남는다.
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "releases-meta/" --output json \
            | jq -r '[.Contents[]? | select(.Key | endswith("/chunks.txt"))] | sort_by(.LastModified) | reverse | .[].Key' \
            | sed -E 's|^releases-meta/([^/]+)/chunks.txt$|\1|' > releases-by-age.txt
          head -n "$KEEP" releases-by-age.txt > kept-releases.txt
          tail -n +"$((KEEP + 1))" releases-by-age.txt > dropped-releases.txt
          grep -qx "$RELEASE_ID" kept-releases.txt || { echo "::error::방금 전환한 릴리스가 보존 목록에 없다 — 정리를 멈춘다"; exit 1; }
          echo "남기는 릴리스: $(paste -sd ' ' kept-releases.txt)"

          while read -r ID; do
            [ -n "$ID" ] || continue
            echo "릴리스 삭제: $ID"
            aws s3 rm "s3://$BUCKET/releases/$ID" --recursive --only-show-errors
            aws s3 rm "s3://$BUCKET/releases-meta/$ID" --recursive --only-show-errors
          done < dropped-releases.txt

          # 2) 청크: 남긴 릴리스들이 쓰는 청크의 합집합은 보존한다.
          : > kept-chunks.txt
          while read -r ID; do
            aws s3 cp "s3://$BUCKET/releases-meta/$ID/chunks.txt" - >> kept-chunks.txt
          done < kept-releases.txt
          sort -u -o kept-chunks.txt kept-chunks.txt

          # aws CLI 의 LastModified 출력 형식과 글자 그대로 맞춘다(사전식 비교를 쓴다).
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%S+00:00)
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "prod/_next/static/" --output json \
            | jq -r --arg cutoff "$CUTOFF" '.Contents[]? | select(.LastModified < $cutoff) | .Key' \
            | sort > old-keys.txt

          comm -23 old-keys.txt kept-chunks.txt > prune-keys.txt
          COUNT=$(wc -l < prune-keys.txt | tr -d ' ')
          echo "버려진 청크 $COUNT 개 (보존 $(wc -l < kept-chunks.txt | tr -d ' ') 개, 기준 $CUTOFF)"
          if [ "$COUNT" -eq 0 ]; then exit 0; fi

          xargs -a prune-keys.txt -n 1 -P 8 -I {} \
            aws s3 rm "s3://$BUCKET/{}" --only-show-errors

  rollback:
    # 수동 실행에서 rollback_to 를 주면 빌드 없이 그 릴리스의 함수를 다시 게시한다(몇 초).
    # 후보: `aws s3 ls s3://<bucket>/releases-meta/` (최근 5개). 다음 정상 배포가 다시 앞으로 넘긴다.
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_to != ''
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check the release is intact
        # 지워졌거나 반쯤 남은 릴리스로 돌리면 사이트가 깨진다. 문서·함수·청크를 모두 확인한다.
        env:
          RELEASE_ID: ${{ inputs.rollback_to }}
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.S3_BUCKET }}"
          if ! [[ "$RELEASE_ID" =~ ^[0-9A-Za-z][0-9A-Za-z-]*$ ]]; then
            echo "::error::릴리스 id 형식이 아니다: $RELEASE_ID"; exit 1
          fi
          if ! aws s3 cp "s3://$BUCKET/releases-meta/$RELEASE_ID/function.js" cf-release-function.js --only-show-errors; then
            echo "::error::릴리스 $RELEASE_ID 가 없다. 남아 있는 릴리스:"
            aws s3 ls "s3://$BUCKET/releases-meta/"
            exit 1
          fi
          aws s3api head-object --bucket "$BUCKET" --key "releases/$RELEASE_ID/index.html" > /dev/null
          aws s3 cp "s3://$BUCKET/releases-meta/$RELEASE_ID/chunks.txt" - | sort > need.txt
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "prod/_next/static/" --output json \
            | jq -r '.Contents[]?.Key' | sort > have.txt
          MISSING=$(comm -23 need.txt have.txt | wc -l | tr -d ' ')
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::릴리스 $RELEASE_ID 의 청크 $MISSING 개가 지워졌다 — 이 릴리스로는 되돌릴 수 없다."; exit 1
          fi
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Switch — publish the release function
        run: |
          set -euo pipefail
          FN="${{ vars.CF_REWRITE_FUNCTION_NAME }}"
          ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront update-function \
            --name "$FN" \
            --if-match "$ETAG" \
            --function-config Comment="rollback to $RELEASE_ID: www->apex 301 + host prefix routing + static export dynamic route rewrite",Runtime=cloudfront-js-2.0 \
            --function-code fileb://cf-release-function.js
          NEW_ETAG=$(aws cloudfront describe-function --name "$FN" --query 'ETag' --output text)
          aws cloudfront publish-function --name "$FN" --if-match "$NEW_ETAG"
          echo "::notice::릴리스 $RELEASE_ID 로 되돌렸다."

      - name: CloudFront Invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} \
            --paths "/*"
