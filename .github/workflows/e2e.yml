name: Cypress E2E

# 푸시 경로의 E2E 는 deploy-prod.yml 의 verify 잡이 담당한다(배포를 게이팅한다).
# 여기는 PR 전용으로 남긴다 — 중복 실행을 피하기 위함이다.
on:
  pull_request:

jobs:
  cypress:
    runs-on: ubuntu-latest

    env:
      # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # BE는 시각을 'yyyy-MM-dd HH:mm:ss' KST 벽시계로 내려주고 parseServerDateTime은
      # 이를 브라우저 로컬로 파싱한다(한국 전용 서비스). 러너 기본 UTC로는 9시간 어긋나
      # 채팅 종료 임박 배너 같은 시각 의존 테스트가 실패하므로 실사용 환경에 맞춘다.
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E
        run: npm run test:e2e:cypress
