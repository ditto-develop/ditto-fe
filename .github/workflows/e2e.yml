name: Cypress E2E

on:
  pull_request:
  push:
    branches:
      - feat/s3-migration

jobs:
  cypress:
    runs-on: ubuntu-latest

    env:
      # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E
        run: npm run test:e2e:cypress
