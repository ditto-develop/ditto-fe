name: Cypress E2E

# PR 과 feat/s3-migration 푸시에서 돈다.
# - PR: 머지 전 검증.
# - feat/s3-migration 푸시: squash 머지는 PR 이 테스트하지 않은 새 커밋을 만든다. 그 커밋을 여기서 테스트해 두면
#   deploy-prod.yml 의 verify 잡이 **같은 커밋**의 통과 결과를 재사용하고 Cypress 를 다시 돌리지 않는다
#   (CLAUDE.md §13.0). 결과가 없거나 실패했으면 verify 가 지금처럼 직접 돌린다.
on:
  pull_request:
  push:
    branches:
      - feat/s3-migration

# 같은 PR 에 새 커밋이 오면 이전 실행은 의미가 없다. 푸시 실행은 커밋마다 결과가 필요하므로 끊지 않는다.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node20 액션 deprecation 대응: 기존 액션 버전 그대로 node24 런타임 사용
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shard:
    name: cypress (${{ matrix.index }}/4)
    runs-on: ubuntu-latest
    strategy:
      # 한 묶음이 실패해도 나머지는 끝까지 돌려 실패를 한 번에 본다.
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]

    env:
      # BE는 시각을 'yyyy-MM-dd HH:mm:ss' KST 벽시계로 내려주고 parseServerDateTime은
      # 이를 브라우저 로컬로 파싱한다(한국 전용 서비스). 러너 기본 UTC로는 9시간 어긋나
      # 채팅 종료 임박 배너 같은 시각 의존 테스트가 실패하므로 실사용 환경에 맞춘다.
      TZ: Asia/Seoul
      NEXT_PUBLIC_API_BASE: http://localhost:10000
      NEXT_PUBLIC_DITTO_API_KEY: cypress-dummy-api-key
      NEXT_PUBLIC_KAKAO_JS_KEY: cypress-dummy-kakao-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Pick this shard's specs
        id: specs
        # 지난 실행 시간(cypress/spec-timings.json)으로 4묶음이 비슷한 길이가 되게 나눈다.
        run: |
          node scripts/cypress-shard.mjs --check 4
          echo "list=$(node scripts/cypress-shard.mjs ${{ matrix.index }} 4)" >> "$GITHUB_OUTPUT"

      - name: Run Cypress E2E
        run: >-
          npx start-server-and-test dev:e2e http://localhost:3100
          "npm run cypress:run:e2e -- --spec '${{ steps.specs.outputs.list }}'"

  # 묶음 전부가 통과해야 통과한다. 이 잡의 이름(cypress)이 예전 단일 잡과 같아서
  # 체크 이름으로 보는 곳(deploy-prod.yml 의 재사용 판단)이 그대로 동작한다.
  cypress:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "Cypress 묶음 중 실패·취소된 것이 있다: ${{ needs.shard.result }}"
            exit 1
          fi
